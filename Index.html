<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
      min-height: 100vh;
    }

    .header {
      background: #fff;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-bottom: 4px solid #c9a227;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .logo-img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: contain;
    }

    .header h1 {
      color: #1a365d;
      font-size: 1.3em;
      font-weight: 700;
    }

    .header h2 {
      color: #c9a227;
      font-size: 0.75em;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 15px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .card label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a365d;
      font-size: 0.85em;
    }

    .card select {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
    }

    .card select:focus {
      outline: none;
      border-color: #c9a227;
    }

    .scanner-box {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .scanner-title {
      background: #1a365d;
      color: #fff;
      padding: 12px;
      text-align: center;
      font-size: 0.85em;
      font-weight: 600;
    }

    #qr-reader {
      width: 100%;
      min-height: 350px;
      background: #000;
    }

    .camera-msg {
      color: #fff;
      text-align: center;
      padding: 80px 20px;
      font-size: 0.95em;
      background: #222;
    }

    .camera-msg button {
      margin-top: 20px;
      padding: 12px 30px;
      background: #c9a227;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
    }

    .stats {
      display: flex;
      gap: 15px;
    }

    .stat-box {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-num {
      font-size: 2.5em;
      font-weight: 700;
      color: #1a365d;
    }

    .stat-label {
      font-size: 0.7em;
      color: #666;
      text-transform: uppercase;
    }

    /* Popup */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: #fff;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 320px;
      margin: 20px;
      animation: popUp 0.3s ease;
    }

    @keyframes popUp {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .popup-icon { font-size: 70px; }

    .popup-name {
      font-size: 1.5em;
      font-weight: 700;
      color: #1a365d;
      margin: 15px 0;
      word-break: break-word;
    }

    .popup-status {
      display: inline-block;
      padding: 10px 25px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1em;
    }

    .popup-status.success { background: #d4edda; color: #155724; }
    .popup-status.duplicate { background: #fff3cd; color: #856404; }
    .popup-status.error { background: #f8d7da; color: #721c24; }

    .loading {
      text-align: center;
      padding: 30px;
      color: #fff;
    }

    .loading-spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #c9a227;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <img class="logo-img" src="https://drive.google.com/thumbnail?id=1ZVJbwpydGHEhKEUkwjpMxS8JVuMd9kWh&sz=w200"
         alt="BCBP">
    <div>
      <h1>BCBP MAASIN CHAPTER</h1>
      <h2>QR ATTENDANCE SYSTEM</h2>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <label>📅 SELECT EVENT</label>
    <select id="eventSelect">
      <option value="">Loading events...</option>
    </select>
  </div>

  <div class="scanner-box">
    <div class="scanner-title">📷 SCAN MEMBER QR CODE</div>
    <div id="qr-reader">
      <div class="camera-msg" id="cameraStatus">
        <div class="loading-spinner"></div>
        Starting camera...
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-num" id="countToday">0</div>
      <div class="stat-label">Scanned</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="countEvents">-</div>
      <div class="stat-label">Events</div>
    </div>
  </div>
</div>

<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <div class="popup-icon" id="popupIcon">✅</div>
    <div class="popup-name" id="popupName">Name</div>
    <div class="popup-status" id="popupStatus">Recorded</div>
  </div>
</div>

<script>
// =====================================================================
// IMPORTANT: paste your Apps Script Web App /exec URL here.
// Get it from: Apps Script editor -> Deploy -> Manage deployments
// -> copy the "Web app" URL (ends in /exec)
// =====================================================================
var API_URL = 'https://script.google.com/macros/s/AKfycbw-aBGePXG4-yIZ8kkTnC9Uu_YEtVnrFXhRCS0-7Fjy9Bd9gqLQexkwu7sIdZVAzTLb/exec';

var html5QrCode = null;
var isScanning = false;
var scanCount = 0;

window.addEventListener('load', function() {
  loadEvents();
});

function loadEvents() {
  fetch(API_URL + '?action=getEvents')
    .then(function(res) { return res.json(); })
    .then(function(result) {
      var select = document.getElementById('eventSelect');
      select.innerHTML = '<option value="">-- Select Event --</option>';

      if (result.success && result.events && result.events.length > 0) {
        document.getElementById('countEvents').textContent = result.events.length;

        for (var i = 0; i < result.events.length; i++) {
          var ev = result.events[i];
          var opt = document.createElement('option');
          opt.value = ev.name;
          opt.textContent = ev.display || ev.name;
          select.appendChild(opt);
        }
      } else {
        select.innerHTML = '<option value="">No events - add in EVENT sheet</option>';
      }

      initCamera();
    })
    .catch(function(error) {
      document.getElementById('eventSelect').innerHTML = '<option value="">Error loading events</option>';
      console.error('loadEvents error:', error);
      initCamera();
    });
}

function initCamera() {
  var readerElement = document.getElementById('qr-reader');
  var statusElement = document.getElementById('cameraStatus');

  if (typeof Html5Qrcode === 'undefined') {
    statusElement.innerHTML = 'QR library failed to load.<br><button onclick="location.reload()">Refresh Page</button>';
    return;
  }

  html5QrCode = new Html5Qrcode("qr-reader");

  Html5Qrcode.getCameras().then(function(devices) {
    if (devices && devices.length > 0) {
      var selectedCamera = devices[0].id;

      for (var i = 0; i < devices.length; i++) {
        var label = devices[i].label.toLowerCase();
        if (label.indexOf('back') !== -1 || label.indexOf('rear') !== -1 || label.indexOf('environment') !== -1) {
          selectedCamera = devices[i].id;
          break;
        }
      }

      if (devices.length > 1) {
        selectedCamera = devices[devices.length - 1].id;
      }

      html5QrCode.start(
        selectedCamera,
        {
          fps: 15,
          qrbox: { width: 280, height: 280 },
          aspectRatio: 1.0
        },
        onQRCodeScanned,
        function(errorMessage) {
          // QR code not detected - normal, keep scanning
        }
      ).then(function() {
        if (statusElement) {
          statusElement.style.display = 'none';
        }
      }).catch(function(err) {
        statusElement.innerHTML = 'Camera error: ' + err + '<br><br><button onclick="location.reload()">Try Again</button>';
      });

    } else {
      statusElement.innerHTML = 'No camera detected.<br><br>Please use a device with a camera.';
    }
  }).catch(function(err) {
    statusElement.innerHTML = 'Camera permission denied.<br><br>Please allow camera access.<br><br><button onclick="location.reload()">Allow & Retry</button>';
  });
}

function onQRCodeScanned(decodedText, decodedResult) {
  if (isScanning) return;

  var eventName = document.getElementById('eventSelect').value;

  if (!eventName) {
    showPopup('⚠️', 'No Event Selected', 'Please select an event first', 'error');
    return;
  }

  isScanning = true;

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }

  var url = API_URL + '?action=recordAttendance'
    + '&event=' + encodeURIComponent(eventName)
    + '&qr=' + encodeURIComponent(decodedText);

  fetch(url)
    .then(function(res) { return res.json(); })
    .then(function(result) {
      if (result.success) {
        scanCount++;
        document.getElementById('countToday').textContent = scanCount;
        showPopup('✅', result.name, 'Attendance Recorded!', 'success');
      } else if (result.duplicate) {
        showPopup('⚠️', result.name, 'Already Recorded', 'duplicate');
      } else {
        showPopup('❌', result.name || 'Unknown', result.message, 'error');
      }

      setTimeout(function() { isScanning = false; }, 2500);
    })
    .catch(function(error) {
      console.error('recordAttendance error:', error);
      showPopup('❌', 'Error', 'Failed to record. Try again.', 'error');
      setTimeout(function() { isScanning = false; }, 2000);
    });
}

function showPopup(icon, name, status, type) {
  document.getElementById('popupIcon').textContent = icon;
  document.getElementById('popupName').textContent = name;
  document.getElementById('popupStatus').textContent = status;
  document.getElementById('popupStatus').className = 'popup-status ' + type;

  var popup = document.getElementById('popup');
  popup.style.display = 'flex';

  setTimeout(function() {
    popup.style.display = 'none';
  }, 2500);
}
</script>

</body>
</html>
